# Builds and deploys to Cloudflare Pages on every push to main.
#
# The Pages project was created with `wrangler pages deploy` (Direct Upload),
# and Cloudflare does not allow converting those to Git-connected projects.
# This runs the same wrangler command CI-side instead, which keeps the existing
# project, its custom domains and its secrets untouched.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account ID from the Cloudflare dashboard URL

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand without pushing

# One deploy at a time; a newer push supersedes an in-flight older one rather
# than racing it to the same project.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Fail here rather than shipping an empty site if the build silently
      # produced nothing.
      - name: Check the build produced a site
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/robots.txt || { echo "dist/robots.txt missing"; exit 1; }
          echo "built $(find dist -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shoyeb-dev --branch=main
